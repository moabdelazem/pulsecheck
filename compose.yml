# Runs the whole stack for local development:
#   cp .env.example .env   # once
#   docker compose up --build
#
# Host ports (fixed, picked to avoid common defaults):
#   dashboard  http://localhost:13000
#   api        http://localhost:18080
#   postgres   localhost:15432

name: pulsecheck

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies scripts/dev/schema.sql on every start (it is idempotent), then exits.
  migrate:
    image: postgres:18.6
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/schema.sql", "${DATABASE_URL:?set DATABASE_URL in .env}"]
    volumes:
      - ./scripts/dev/schema.sql:/schema.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./api
    image: pulsecheck-api
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    ports:
      - "18080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  checker:
    build: ./checker
    image: pulsecheck-checker
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      CHECK_INTERVAL: ${CHECK_INTERVAL:-30s}
      CHECK_TIMEOUT: ${CHECK_TIMEOUT:-5s}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    image: pulsecheck-dashboard
    environment:
      API_URL: http://api:8080
    ports:
      - "13000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
