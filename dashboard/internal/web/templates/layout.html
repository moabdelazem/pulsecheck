{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{if and .Refresh (not .Error)}}<meta http-equiv="refresh" content="{{.Refresh}}">{{end}}
<title>{{.Title}} · Pulse Check</title>
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --text: #1c1c1a; --muted: #6b6b66; --border: #e3e3de;
    --up: #1f7a4d; --up-bg: #e3f3ea; --down: #b42318; --down-bg: #fbe9e7;
    --wait: #8a6d1f; --wait-bg: #f6efd9; --accent: #2d5bd7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --surface: #1d1d1b; --text: #ecebe6; --muted: #9b9a93; --border: #2e2e2b;
      --up: #5fcf92; --up-bg: #183326; --down: #f2867a; --down-bg: #3a1c19;
      --wait: #e0c26d; --wait-bg: #352d17; --accent: #8aa8ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); }
  header { border-bottom: 1px solid var(--border); background: var(--surface); }
  header .wrap { display: flex; align-items: center; gap: 12px; padding-block: 14px; }
  header a { color: var(--text); text-decoration: none; font-weight: 600; }
  .wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; }
  main { padding-block: 24px 48px; }
  h1 { font-size: 22px; margin: 0 0 16px; overflow-wrap: anywhere; }
  .muted { color: var(--muted); }
  .alert { background: var(--down-bg); color: var(--down); border: 1px solid currentColor;
           border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { padding: 14px 16px; }
  .stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 13px; font-weight: 500; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  td.url { white-space: normal; overflow-wrap: anywhere; min-width: 200px; }
  td.num { font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .pill.up { color: var(--up); background: var(--up-bg); }
  .pill.down { color: var(--down); background: var(--down-bg); }
  .pill.wait { color: var(--wait); background: var(--wait-bg); }
  form.add { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  form.add input { flex: 1 1 260px; }
  input, button { font: inherit; border-radius: 8px; padding: 8px 12px; }
  input { border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  button { border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button.danger { background: transparent; color: var(--down); border-color: var(--border); padding: 4px 10px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .strip { display: flex; gap: 3px; padding: 14px 16px; margin-bottom: 20px; }
  .strip span { flex: 1; height: 28px; border-radius: 3px; min-width: 3px; }
  .strip .up { background: var(--up); } .strip .down { background: var(--down); }
  .empty { padding: 32px 16px; text-align: center; }
  h2 { font-size: 16px; margin: 24px 0 10px; }
  .row { display: flex; justify-content: space-between; align-items: start; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<header><div class="wrap"><a href="/">Pulse Check</a><span class="muted">dashboard</span></div></header>
<main class="wrap">
{{with .Error}}<div class="alert" role="alert">{{.}}</div>{{end}}
{{template "content" .}}
</main>
</body>
</html>{{end}}

{{define "status"}}{{if not .}}<span class="pill wait">Pending</span>{{else if .Up}}<span class="pill up">Up</span>{{else}}<span class="pill down">Down</span>{{end}}{{end}}
